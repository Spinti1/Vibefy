name: Vibefy
options:
  bundleIdPrefix: online.usevibefy
  deploymentTarget:
    iOS: '15.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.2.1'
    CURRENT_PROJECT_VERSION: '3'
    CODE_SIGNING_ALLOWED: NO
targets:
  Vibefy:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes: [NativePrototype.swift]
      - path: ../shared/app-shell.js
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: online.usevibefy.mobile
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: '1,2'
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Vibefy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        CFBundleURLTypes:
          - CFBundleURLName: online.usevibefy.jam
            CFBundleURLSchemes: [vibefy]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
