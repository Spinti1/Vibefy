name: Vibefy
options:
  bundleIdPrefix: online.usevibefy
  deploymentTarget:
    iOS: '15.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.2.8'
    CURRENT_PROJECT_VERSION: '10'
    CODE_SIGNING_ALLOWED: NO
packages:
  YouTubeKit:
    url: https://github.com/Spinti1/YouTubeKit
    revision: 7f75a2299dc329c0b7855afb25d47663a02855cb
targets:
  Vibefy:
    dependencies:
      - package: YouTubeKit
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes: [NativePrototype.swift]
      - path: ../shared/app-shell.js
        buildPhase: resources
      - path: ../licenses
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: online.usevibefy.mobile
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: '1,2'
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Vibefy
        NSCameraUsageDescription: Scan a playlist QR code from Vibefy on your computer. Images stay on your device.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        CFBundleURLTypes:
          - CFBundleURLName: online.usevibefy.jam
            CFBundleURLSchemes: [vibefy]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
