plugins { id 'com.android.application' }
android {
 namespace 'online.usevibefy.mobile'
 compileSdk 35
 sourceSets { main { assets.srcDirs = ['../../shared', '../../licenses'] } }
 defaultConfig {
  applicationId 'online.usevibefy.mobile'
  minSdk 26
  targetSdk 35
  versionCode 9
  versionName '0.2.7'
 }
 compileOptions { coreLibraryDesugaringEnabled true; sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 buildTypes { release { minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
}

dependencies {
 // Only resolves public audio metadata on the device; no video stream is selected.
 implementation("com.github.teamnewpipe:NewPipeExtractor:v0.27.1") { exclude group: "org.mozilla", module: "rhino-engine" }
 coreLibraryDesugaring "com.android.tools:desugar_jdk_libs_nio:2.1.5"
 testImplementation "junit:junit:4.13.2"
 implementation "androidx.webkit:webkit:1.12.1"
 implementation "androidx.media3:media3-exoplayer:1.5.1"
 implementation "androidx.media3:media3-session:1.5.1"
}
