name: Diagnose Vibefy iOS re-signing
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resign:
    runs-on: macos-15
    steps:
      - name: Download exact released IPAs and verify SHA-256
        shell: python
        run: |
          import hashlib, pathlib, urllib.request, zipfile
          packages={"0.2.7":"116ed7d308536318fc5bc4c2445fc8050437138ccdeb2595ad9a53e0d2625a47","0.2.8":"3ddff0c72dc94f100f39e1d3770c8835ba0d04b8b39cb09d4ea0156413813226"}
          for version,digest in packages.items():
              url=f"https://github.com/Spinti1/Vibefy/releases/download/mobile-v{version}/Vibefy-{version}.ipa"
              data=urllib.request.urlopen(url,timeout=45).read(6000000)
              assert hashlib.sha256(data).hexdigest()==digest
              archive=pathlib.Path(version+".ipa"); archive.write_bytes(data)
              with zipfile.ZipFile(archive) as z:
                  assert all(not n.startswith("/") and ".." not in pathlib.PurePosixPath(n).parts for n in z.namelist())
                  z.extractall(version)
      - name: Re-sign both released applications with an ephemeral ad-hoc signature
        run: |
          set -e
          for version in 0.2.7 0.2.8; do
            app="$version/Payload/Vibefy.app"
            /usr/bin/codesign --force --deep --sign - "$app"
            /usr/bin/codesign --verify --deep --strict --verbose=2 "$app"
            /usr/bin/codesign --display --verbose=2 "$app"
            echo "RESIGN_OK=$version"
          done
