name: Vibefy checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: pip install -r web/requirements.lock
      - run: python -m unittest discover -s web/tests -v
      - run: node --check web/public/player.js && node --check web/public/embedded-player.js
  native:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --all --check
      - run: cargo test --release --locked -j 2 --test update_integrity --test update_launch --test branding
