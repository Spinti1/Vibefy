name: Vibefy checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: pip install -r web/requirements.lock
      - run: python -m unittest discover -s web/tests -v
      - run: node --check web/public/player.js && node --check web/public/embedded-player.js && node --check web/public/spotify.js && node --check web/public/mobile-mods.js
      - run: node --test web/tests/*.test.cjs
  native:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --all --check
      - run: |
          New-Item -ItemType Directory -Force target | Out-Null
          rustc --edition 2024 --test src/title_similarity.rs -o target/title-similarity-tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./target/title-similarity-tests.exe
      - run: cargo test --release --locked -j 2 --features demo --test update_integrity --test update_launch --test branding --test spotify_match --test source_playlist --test window_restore --test recording_match --test native_addons --test mod_artwork --test visual_buffers
      - run: cargo test --release --locked -j 2 --features demo --test spicy_native tests::
      - run: cargo test --release --locked -j 2 --features demo --test spicy_native ui::word_line_plain_and_error_views_render_in_both_themes
