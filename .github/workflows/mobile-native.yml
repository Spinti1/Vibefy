name: Build Vibefy Android candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p mobile/android --no-daemon assembleDebug assembleRelease testReleaseUnitTest lintRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Vibefy-Android-hybrid-candidate
          path: |
            mobile/android/app/build/outputs/apk/debug/*.apk
            mobile/android/app/build/outputs/apk/release/*.apk
            mobile/android/app/build/reports/lint-results-release.html
          retention-days: 7
